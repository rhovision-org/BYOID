# Temporary HTTP-only vhost for first-time certificate issuance.
#
# Install this before certbot, then replace it with byoid.rhobot.net.conf:
#   install -m 0644 deploy/nginx/byoid.rhobot.net.http.conf \
#     /etc/nginx/sites-available/byoid.rhobot.net
#   ln -sfn /etc/nginx/sites-available/byoid.rhobot.net \
#     /etc/nginx/sites-enabled/byoid.rhobot.net
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d byoid.rhobot.net --non-interactive --agree-tos --redirect
#   install -m 0644 deploy/nginx/byoid.rhobot.net.conf \
#     /etc/nginx/sites-available/byoid.rhobot.net
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name byoid.rhobot.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
