# byoid.rhobot.net — TLS termination for the BYOID OAuth/identity server.
#
# Install as /etc/nginx/sites-available/byoid.rhobot.net and symlink into
# sites-enabled. The certificate paths are created by:
#   sudo certbot --nginx -d byoid.rhobot.net
# Adjust them if certbot chooses a different lineage name.
#
# The Node server binds 127.0.0.1:3100 only. Provider client secrets stay in
# /etc/byoid/byoid.env and never pass through nginx or the browser.

server {
    listen 80;
    listen [::]:80;
    server_name byoid.rhobot.net;

    # certbot's HTTP-01 challenge must remain reachable before redirecting.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name byoid.rhobot.net;

    ssl_certificate     /etc/letsencrypt/live/byoid.rhobot.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/byoid.rhobot.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/byoid.access.log;
    error_log  /var/log/nginx/byoid.error.log;

    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
